name: Release

# Every push to main cuts a new release: auto-bump the version, build the Windows
# exe, and publish it as a release asset.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize runs so version bumping never races on the tag list.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            ver=${latest#v}
            IFS=. read -r major minor patch <<< "$ver"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows executable
        run: |
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -manifest cmd/turbokey/app.manifest -arch amd64 -o cmd/turbokey/rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-H windowsgui -s -w" -o turbokey.exe ./cmd/turbokey

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          files: turbokey.exe
          generate_release_notes: true
